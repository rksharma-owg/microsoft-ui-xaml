name: PR Build
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact contribution commit to compile
        required: true
        type: string
      flavors:
        description: JSON array of configurations to validate
        required: true
        default: '["x86chk", "x86fre", "amd64fre", "arm64chk", "arm64fre"]'
        type: string
permissions:
  contents: read
jobs:
  product-matrix:
    name: Product (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavors) }}
    env:
      CL: /MP2
      EXPECTED_SHA: ${{ inputs.tested_sha }}
      BUILD_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
          path: source
      - name: Verify tested commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Wrong checkout: $actual" }
          Write-Host "Tested SHA: $actual; flavor: $env:BUILD_FLAVOR"
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Build product and package
        working-directory: source
        shell: pwsh
        run: |
          .\init.ps1 $env:BUILD_FLAVOR /nopgo /notitle
          .\initrun.ps1 -Flavor $env:BUILD_FLAVOR .\build.cmd product /q /b 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "Product build failed: $LASTEXITCODE" }
          if (Select-String -Path build.log -Pattern 'ERROR: buildSolution|error MSB\d+|error C\d+|error CS\d+' -Quiet) {
            throw "Build log contains errors despite a zero exit code"
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diagnostics-${{ matrix.flavor }}
          retention-days: 3
          path: |
            source/BuildOutput/**/*.binlog
            source/build.log

name: PR Build
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact contribution commit to compile
        required: true
        type: string
      run_regressions:
        description: Execute the three ItemsRepeater move regressions after building
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  baseline-build:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CL: /MP2
      EXPECTED_SHA: ${{ inputs.tested_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
          path: source
      - name: Verify tested commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Wrong checkout: $actual" }
          Write-Host "Tested SHA: $actual"
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
      - uses: actions/download-artifact@v5
        with:
          name: compiled-test-binaries
          run-id: 36678244804
          github-token: ${{ github.token }}
          path: source
      - name: Verify compiled artifact and run targeted API tests
        working-directory: source
        shell: pwsh
        run: |
          $compiled = (Get-Content compiled-sha.txt).Trim()
          if ($compiled -ne $env:EXPECTED_SHA) { throw "Wrong compiled SHA: $compiled" }
          $app = 'BuildOutput/bin/amd64chk/Test/UnpackagedApps/MUXControlsTestApp'
          $sdkRoot = "${env:ProgramFiles(x86)}/Microsoft SDKs"
          $dependency = Get-ChildItem $sdkRoot -Recurse -Filter Microsoft.VCLibs.x64.Debug.14.00.Desktop.appx | Select-Object -First 1
          if (-not $dependency) { throw 'Debug desktop VCLibs package not found in Windows SDK' }
          & powershell.exe -NoProfile -Command "Add-AppxPackage -Path '$($dependency.FullName)' -ErrorAction Stop"
          if ($LASTEXITCODE -ne 0) { throw 'VCLibs registration failed' }
          foreach ($file in @('te.exe', 'TE.ProcessHost.exe', 'MUXControlsTestApp.dll', 'localDotNet')) {
            if (-not (Test-Path "$app/$file")) { throw "Missing runtime input: $file" }
          }
          Push-Location $app
          try {
            $query = "@Name='*RepeaterTests.ViewManagerTests.*'"
            $PSNativeCommandArgumentPassing = 'Legacy'
            & .\te.exe MUXControlsTestApp.dll "/select:`"$query`"" /p:SkipConsoleWindowMinimize 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/source/regression-tests.log"
            $testExit = $LASTEXITCODE
            $summary = Get-Content "$env:GITHUB_WORKSPACE/source/regression-tests.log" | Where-Object { $_ -match 'Summary:\s+Total=\d+' } | Select-Object -Last 1
            if ($testExit -ne 0 -or $summary -notmatch 'Total=14,' -or $summary -notmatch 'Passed=14,' -or $summary -notmatch 'Failed=0,' -or $summary -notmatch 'Blocked=0,' -or $summary -notmatch 'Skipped=0') {
              throw "All 14 enabled ViewManager tests must pass (TAEF omits the 4 Ignore=True tests). Exit=$testExit Summary=$summary"
            }
          } finally { Pop-Location }
      - name: Collect MSBuild crash diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          Get-ChildItem -Path $env:TEMP -Filter 'MSBuild_*.failure.txt' -Recurse -ErrorAction SilentlyContinue |
            Copy-Item -Destination diagnostics
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-diagnostics
          path: |
            source/BuildOutput/**/*.binlog
            source/build.log
            source/regression-tests.log
            diagnostics/**
          if-no-files-found: ignore

name: PR Build
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact contribution commit to compile
        required: true
        type: string
      flavors:
        description: JSON array of configurations to validate
        required: true
        default: '["x86chk", "x86fre", "amd64fre", "arm64chk", "arm64fre"]'
        type: string
permissions:
  contents: read
jobs:
  product-matrix:
    name: Product (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavors) }}
    env:
      CL: /MP2
      EXPECTED_SHA: ${{ inputs.tested_sha }}
      BUILD_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify tested commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Wrong checkout: $actual" }
          Write-Host "Tested SHA: $actual; flavor: $env:BUILD_FLAVOR"
          # Release PGO tooling resolves origin/main; use the real upstream baseline.
          git remote set-url origin https://github.com/microsoft/microsoft-ui-xaml.git
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Upstream baseline fetch failed' }
          $baseline = git rev-parse origin/main
          if ($baseline -ne '5d329a5c8eb5b8ca5b35069c7352d661c07924ee') { throw "Baseline changed: $baseline" }
          $mergeBase = git merge-base origin/main HEAD
          if ($mergeBase -ne $baseline) { throw "Wrong merge base: $mergeBase" }
          Write-Host "Verified upstream baseline: $baseline"
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Build product and package
        working-directory: source
        shell: pwsh
        run: |
          .\init.ps1 $env:BUILD_FLAVOR /nopgo /notitle
          # Match upstream build-pr.ps1's /nopgo after initrun resets the environment.
          @'
          @echo off
          set PGOBuildMode=Off
          call build.cmd product /q /b
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Encoding ascii preflight-product.cmd
          .\initrun.ps1 -Flavor $env:BUILD_FLAVOR .\preflight-product.cmd 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "Product build failed: $LASTEXITCODE" }
          if (Select-String -Path build.log -Pattern 'ERROR: buildSolution|error MSB\d+|error C\d+|error CS\d+' -Quiet) {
            throw "Build log contains errors despite a zero exit code"
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diagnostics-${{ matrix.flavor }}
          retention-days: 3
          path: |
            source/BuildOutput/**/*.binlog
            source/build.log

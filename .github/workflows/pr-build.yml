name: PR Build
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact contribution commit to compile
        required: true
        type: string
permissions:
  contents: read
jobs:
  baseline-build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CL: /MP2
      EXPECTED_SHA: ${{ inputs.tested_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
          path: source
      - name: Verify tested commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Wrong checkout: $actual" }
          Write-Host "Tested SHA: $actual"
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Initialize and build product and tests
        working-directory: source
        shell: cmd
        run: call init.cmd x64chk /nopgo && call build.cmd /q /b
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-diagnostics
          path: source/BuildOutput/**/*.binlog
          if-no-files-found: ignore
